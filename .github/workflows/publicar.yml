# Construye y revisa el sitio en cada pull request; publica en GitHub Pages al fusionar en main.
# Requiere: Settings → Pages → Source = "GitHub Actions" (paso del lanzamiento, ver LANZAMIENTO.md).
# Variables opcionales (Settings → Secrets and variables → Actions → Variables):
#   PUBLIC_UMAMI_WEBSITE_ID, PUBLIC_WEB3FORMS_KEY, PUBLIC_WEB3FORMS_HCAPTCHA
#   Autodiagnóstico: PUBLIC_AUTODIAGNOSTICO_URL, PUBLIC_SUPABASE_PUBLISHABLE_KEY, PUBLIC_TURNSTILE_SITE_KEY
#   (todas son públicas por diseño; ningún secreto va aquí ni en el repo). La URL de la función y la llave
#   publicable de Delta BI van por defecto abajo; PUBLIC_TURNSTILE_SITE_KEY (llave pública de Cloudflare) también va por defecto.
name: Publicar sitio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Construir (falla si el contenido tiene errores)
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          PUBLIC_SITE_URL: https://deltafractional.com
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || '8a0c8333-6c0c-4641-932e-860fd9774b8f' }}
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_WEB3FORMS_HCAPTCHA: ${{ vars.PUBLIC_WEB3FORMS_HCAPTCHA }}
          PUBLIC_AUTODIAGNOSTICO_URL: ${{ vars.PUBLIC_AUTODIAGNOSTICO_URL || 'https://bvlunlwnsrozkfuwcxqb.supabase.co/functions/v1/autodiagnostico-guardar' }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Yn6IKULgkI4Vc4s8ckRDew_L4GRfqBz' }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAGJB7RlA2w4p5Q4n' }}
      - name: Revisar textos, marca y SEO
        run: npm run revisar
      - name: Probar el cálculo del autodiagnóstico
        run: node scripts/probar-cuestionario.mjs
      # Solo al publicar en producción: el autodiagnóstico no sale con datos pendientes
      # (política en borrador, identificación, correo, retención o variables).
      - name: Revisar que nada quede pendiente para el lanzamiento
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/revisar.mjs --lanzamiento
        env:
          PUBLIC_AUTODIAGNOSTICO_URL: ${{ vars.PUBLIC_AUTODIAGNOSTICO_URL || 'https://bvlunlwnsrozkfuwcxqb.supabase.co/functions/v1/autodiagnostico-guardar' }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Yn6IKULgkI4Vc4s8ckRDew_L4GRfqBz' }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAGJB7RlA2w4p5Q4n' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
